spring:
  application:
    name: authentication-service
  datasource:
    url: ${AUTH_DB_URL}
    username: ${AUTH_DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    open-in-view: false

server:
  port: ${AUTH_SERVER_PORT}

admin:
  email: ${AUTH_ADMIN_EMAIL}
  password: ${AUTH_ADMIN_PASSWORD}

jwt:
  access-secret: ${AUTH_JWT_ACCESS_SECRET}
  refresh-secret: ${AUTH_JWT_REFRESH_SECRET}
  access-expiration: ${AUTH_JWT_ACCESS_EXPIRATION}
  refresh-expiration: ${AUTH_JWT_REFRESH_EXPIRATION}

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}

shipment-service:
  url: ${AUTH_SHIPMENT_SERVICE_URL:http://localhost:8082}

common-service:
  url: ${AUTH_COMMON_SERVICE_URL:http://localhost:8081}
