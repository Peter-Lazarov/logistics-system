spring:
  application:
    name: authentication-service
  datasource:
    url: ${AUTH_DB_URL}
    username: ${AUTH_DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}

server:
  port: ${AUTH_SERVER_PORT}

admin:
  email: ${AUTH_ADMIN_EMAIL}
  password: ${AUTH_ADMIN_PASSWORD}

jwt:
  access-secret: ${AUTH_JWT_ACCESS_SECRET}
  refresh-secret: ${AUTH_JWT_REFRESH_SECRET}
  access-expiration: ${AUTH_JWT_ACCESS_EXPIRATION}
  refresh-expiration: ${AUTH_JWT_REFRESH_EXPIRATION}
