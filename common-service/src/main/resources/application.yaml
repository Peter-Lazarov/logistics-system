spring:
  application:
    name: common-service
  datasource:
    url: ${COMMON_DB_URL}
    username: ${COMMON_DB_USERNAME}
    password: ${COMMON_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

server:
  port: ${COMMON_SERVER_PORT}

jwt:
  access-secret: ${COMMON_JWT_ACCESS_SECRET}
  refresh-secret: ${COMMON_JWT_REFRESH_SECRET}
