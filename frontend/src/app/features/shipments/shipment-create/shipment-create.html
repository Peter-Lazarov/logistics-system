@if (data$ | async; as vm) {
  <form [formGroup]="form" (ngSubmit)="createShipment()" class="shipment-form standard-form">

    <h2 class="page-title">Create Shipment</h2>

    <div class="standard-field-row">
      <label for="shipment-client">Client</label>
      <select id="shipment-client" formControlName="clientUserId">
        <option value="">Select Client</option>
        @for (client of vm.clients; track client.id || client.clientUserId || $index) {
          <option [value]="client.id || client.clientUserId">
            {{ client.id || client.clientUserId }} - {{ client.name }}
          </option>
        }
      </select>
    </div>

    <div class="standard-field-row">
      <label for="shipment-origin">Origin</label>
      <input id="shipment-origin" formControlName="origin" placeholder="Origin">
    </div>

    <div class="standard-field-row">
      <label for="shipment-destination">Destination</label>
      <input id="shipment-destination" formControlName="destination" placeholder="Destination">
    </div>

    <div class="standard-field-row">
      <label for="shipment-category">Category</label>
      <input id="shipment-category" formControlName="category" placeholder="Category">
    </div>

    <div class="standard-field-row">
      <label for="shipment-description">Description</label>
      <input id="shipment-description" formControlName="description" placeholder="Description">
    </div>

    <div class="standard-field-row">
      <label for="shipment-weight">Weight (kg)</label>
      <input id="shipment-weight" type="number" formControlName="totalWeight" placeholder="Weight">
    </div>

    <div class="standard-field-row">
      <label for="shipment-volume">Volume (m³)</label>
      <input id="shipment-volume" type="number" formControlName="totalVolume" placeholder="Volume">
    </div>

    <div class="standard-field-row">
      <label for="shipment-route">Planned route</label>
      <select id="shipment-route" formControlName="simulationRoute">
        <option [ngValue]="null">No planned route</option>
        <option value="BOTEVGRADSKO">Botevgradsko</option>
        <option value="BOJURISHTE">Bojurishte</option>
        <option value="KAZICHENE">Kazichene airport</option>
      </select>
    </div>

    <div class="standard-field-row">
      <label for="shipment-driver">Driver</label>
      <select id="shipment-driver" formControlName="driverId" (change)="onDriverChange($any($event.target).value)">
        <option value="">Select Driver</option>
        @for (driver of vm.drivers; track driver.userId || $index) {
          <option [value]="driver.userId">
            {{ driver.userId }} - {{ driver.licenseNumber }}
          </option>
        }
      </select>
    </div>

    <div class="standard-field-row">
      <label for="shipment-vehicle">Vehicle</label>
      <input id="shipment-vehicle" formControlName="vehicleId" placeholder="Vehicle" readonly>
    </div>

    <div class="standard-field-row">
      <label for="shipment-price">Price (euro)</label>
      <input id="shipment-price" type="number" formControlName="price" placeholder="Price">
    </div>

    <button type="submit">Create Shipment</button>

    @if (errorMessage) {
      <p class="message error" role="alert">{{ errorMessage }}</p>
    }
    @if (successMessage) {
      <p class="message success" role="status">{{ successMessage }}</p>
    }

  </form>
} @else {
  <p>Loading form data...</p>
}
