<header class="topbar">
  <div class="logo">Logistics System</div>

  <nav>
    @if (!isClient() && !isEmployee() && !isAdmin()) {
    <a class="create-btn" routerLink="/login">Login</a>
    <a class="create-btn" routerLink="/register">Register</a>
    } @if (isClient()) {
    <a class="create-btn" routerLink="/shipments/my"> My Shipments </a>
    <a class="create-btn" routerLink="/shipments/request"> Shipment Request </a>
    } @if (isEmployee()) {
    <a class="create-btn" routerLink="/shipments"> Shipments </a>
    <!-- <a class="create-btn" routerLink="/shipments/create"> Create Shipment </a> -->
    } @if (isAdmin()) {
    <a class="create-btn" routerLink="/shipments"> Shipments </a>
    <a class="create-btn" routerLink="/admin/register-employee">
      Register Employee
    </a>
    } @if (isClient() || isEmployee() || isAdmin()) {
    <a class="create-btn" routerLink="/profile"> Profile </a>
    <div class="user-info">
      <span class="user-email">{{ email }}</span>
      <button class="logout-btn" (click)="logout()">Logout</button>
    </div>
    }
  </nav>
</header>
<div class="banner"></div>

<main class="content">
  <router-outlet></router-outlet>
</main>
