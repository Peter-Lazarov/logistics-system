<div class="login-container">
    <h2>Login</h2>

    <form (ngSubmit)="login()">
        <input
            type="email"
            name="email"
            placeholder="Email"
            [(ngModel)]="email">

        <input
            type="password"
            name="password"
            placeholder="Password"
            [(ngModel)]="password">

        <button type="submit">Login</button>
    </form>

    <div class="banner"></div>
</div>
