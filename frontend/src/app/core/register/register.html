<div class="register-container">
  <h2>Client Registration</h2>

  <form (ngSubmit)="register()">
    <input type="email" name="email" placeholder="Email" [(ngModel)]="email" />
    <input type="password" name="password" placeholder="Password" [(ngModel)]="password" />
    <input type="text" name="name" placeholder="Full Name" [(ngModel)]="name" />
    <input type="text" name="phone" placeholder="Phone" [(ngModel)]="phone" />

    <button type="submit">Register</button>
  </form>

  @if (errorMessage) {
    <p class="message error" role="alert">{{ errorMessage }}</p>
  }
  @if (successMessage) {
    <p class="message success" role="status">{{ successMessage }}</p>
  }

  <div class="banner"></div>
</div>
