server {
    listen 80;
    server_name logistics.pokazva.bg;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name logistics.pokazva.bg;

    ssl_certificate /etc/letsencrypt/live/logistics.pokazva.bg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logistics.pokazva.bg/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /api/auth/ {
        proxy_pass http://authentication-service:8080/auth/;
    }

    location /api/common/ {
        proxy_pass http://common-service:8081/;
    }

    location /api/shipments/ {
        proxy_pass http://shipment-service:8082/shipments/;
    }

    location /api/tracking/ {
        proxy_pass http://tracking-service:8084/tracking/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}